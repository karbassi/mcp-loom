[project]
name = "mcp-loom"
version = "1.1.0"
description = "MCP server for Loom's internal GraphQL API"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
]

[project.scripts]
loom-mcp = "loom_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["T20"]
